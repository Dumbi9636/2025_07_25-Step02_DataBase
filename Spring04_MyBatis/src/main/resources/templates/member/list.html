<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>templates/member/list.html</title>
<th:block th:insert="/include/resource"></th:block>
</head>
<body>
	<div class="container mt-4">
		<h1 class="mb-4">회원 목록</h1>
		<table class="table table-striped table-hover text-center align-middle">
			<thead class="table-dark">
				<tr>
					<th>번호</th>
					<th>이름</th>
					<th>주소</th>
					<th>수정</th>
					<th>삭제</th>
				</tr>
			</thead>
			<tbody>
				<!--
					"list" 라는 키값으로 담긴 데이터는 List<MemberDto> 이다
					따라서 tmp 는 MemberDto type 이다 
					tmp.getNum() 하면 번호를 얻어낼 수 있는데 EL 에서는 
					tmp.num 해도 자동으로 getter 메소드를 호출해준다.
				 -->
				
					<tr th:each="tmp : ${list}">
						<td th:text="${tmp.num}"></td>
						<td th:text="${tmp.name}"></td>
						<td th:text="${tmp.addr}"></td>
						<td>
							<a th:href="@{/member/updateform(num=${tmp.num}, name=${tmp.name})}">수정</a>
						</td>
						<td><a th:href="@{/member/delete(num=${tmp.num}, name=${tmp.name})}" 
								onclick="return confirm('삭제하시겠습니까?');">삭제</a>
						</td>
					</tr>
			
			</tbody>
		</table>
		<div class="mt-3 text-end">
			<a th:href="@{/}" class="btn btn-secondary">인덱스로 가기</a>
			<a th:href="@{/member/insertform}" class="btn btn-primary">회원 추가</a>
		</div>
	</div>
</body>
</html>
