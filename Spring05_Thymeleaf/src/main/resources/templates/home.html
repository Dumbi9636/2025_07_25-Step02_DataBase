<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>templates/home.html</title>
</head>
<body>
	<div class="container">
		<h1>인덱스 페이지 입니다</h1>
		<p>

			<br /> 
			<!-- 기존 src 경로 -->
			<img src="/Spring05/images/Spain.png" alt="스페인 국기 이미지" />
			<!-- 타임리프 src 경로(context-path가 자동으로 붙음) -->
			<img th:src="@{/images/Spain.png}" alt="" />

		<hr />
		<h2>공지사항</h2>

			<li th:each="tmp : ${notice}">[[${tmp}]]</li>

		<h3>Thymeleaf 연습</h3>
		<ul>
			<li><a th:href="@{/member/detail}">회원 한명의 정보</a></li>
			<!--  href="/spring05/member/detail -->
			<li><a th:href="@{/member/list}">회원목록 보기</a></li>
			<li><a th:href="@{/if}">조건부 렌더링</a></li>
			<li><a th:href="@{/form}">form 테스트</a></li>
			<li><a th:href="@{/include-test}">include 테스트</a></li>
			<li><a th:href="@{/print-num}">반복문 돌면서 숫자 출력</a></li>
			<li><a th:href="@{/unescape}">unescape 테스트</a></li>
			<li><a th:href="@{/javascript}">javascript 출력</a></li>
		</ul>
		<hr />
	</div>
</body>
</html>
