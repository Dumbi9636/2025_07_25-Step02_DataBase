<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>/gallery/list.html</title>
<th:block th:insert="~{/include/resource :: bootstrap}"></th:block>
</head>
<body>
	<th:block th:insert="~{/include/navbar :: nav('board')}"></th:block>
	
	<div class="container mt-3">
		<a class="btn btn-warning btn-sm mb-2 border border-1 border-dark" th:href="@{/gallery/new-form}">
	       <i class="bi bi-image"></i> 
	       <i class="bi bi-plus"></i>
	       <!-- 포커스가 왔을때 갤러리 새글 작성이라는 텍스트를 보여줄 수 있도록 visually hidden -->
	       <span class="visually-hidden">겔러리 새글 작성</span>
	    </a>
		<h1>Gallery 목록</h1>
		<img th:src="@{/images/banner2.jpg}" class="img-fluid w-100 mb-5" alt="풀폭 배너"  style="max-height:300px; object-fit:cover; border: 3px solid black !important;" />
		<div class="row" id="masonry-grid">
			<div class="col-sm-6 col-md-4 col-lg-3 mb-4 " 
				 th:each="tmp : ${list}">
				<div class="card">
			            <!-- 대표 이미지 (추가한 갤러리의 첫 번째 이미지를 대표이미지로 1개만 일단 출력하겠다) -->
			            <img class="card-img-top" 
			            	 th:src="@{/upload/{name}(name=${tmp.imageList[0].saveFileName})}" /> 
			            <div class="card-body">
			                <!-- 제목 -->
			                <h4 th:text="${tmp.title}"></h4>
			                <!-- 이미지 개수 -->
			                <a class="btn btn-sm btn-warning border border-1 border-dark"
			                   th:href="@{/gallery/view(num=${tmp.num})}">
			                   [[${#lists.size(tmp.imageList)}]] 개의 이미지
			                </a>
			            </div>
			     </div> <!-- .card -->
			</div> <!-- .column -->
		</div>	<!-- .row -->
	</div> <!-- .container -->
	<script>
		const grid = document.querySelector("#masonry-grid");
		imagesLoaded(grid, ()=>{
			new Masonry(grid, { percentPosition:true});
		});
	</script>
	
	<th:block th:insert="~{/include/footer :: footer}"></th:block>
</body>
</html>
