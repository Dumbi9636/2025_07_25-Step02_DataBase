<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>/gallery/new-form.html</title>
<th:block th:insert="~{/include/resource :: bootstrap}"></th:block>
<style>
    .drop-zone {
        border: 2px dashed #0d6efd;
        cursor: pointer;
        border-radius: 10px;
        background-color: #f8f9fa;
        display:flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        border-color: #000000;
        
    }
    /* drop zone 에 파일을 드레그해서 위에 올렸을때 적용할 css */
    .drop-zone.dragover {
        background-color: #e9eff5;
    }
    .preview img {
        max-width: 120px;
        margin: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .preview-item {
        position: relative;
        display: inline-block;
    }
	.remove-btn {
	    position: absolute;
	    top: 11px;
	    right: 11px;
	    background-color: #ffffffcc; /* 반투명 흰색 */
	    color: #333;
	    border: none;
	    border-radius: 4px;
	    width: 20px;
	    height: 20px;
	    font-size: 16px;
	    cursor: pointer;
	    text-align: center;
	    transition: background-color 0.2s, color 0.2s;
	    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
	    display: flex;
		align-items: center;
		justify-content: center;
	}
	
	.remove-btn:hover {
	    background-color: #dc3545;
	    color: white;
	}
</style>
</head>
<body>
	<th:block th:insert="~{/include/navbar :: nav('board')}"></th:block>
	
	<div class="container mt-4">
    <h2><i class="bi bi-image"></i> 새 갤러리 작성</h2>
    <form id="saveForm" th:action="@{/gallery/save}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea class="form-control" id="content" name="content" rows="6" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">이미지 업로드 (Drag & Drop 또는 클릭)</label>
            <div class="drop-zone" id="dropZone">
                이곳에 이미지를 끌어다 놓거나 클릭하여 선택하세요.
                <!-- 여러개의 이미지가 업로드, 다중 파일 선택 하나의 파라미터명으로 여러개의 이미지가 날라감 
                	galleryDto 에 miltiple 을 받을 필드를 선언해야함. 여러개니까 multiple 의 배열로 받아야함 
                 -->
                <input type="file" name="images" id="fileInput" multiple hidden>
            </div>
            <div class="preview d-flex flex-wrap mt-3" id="preview"></div>
        </div>

        <button type="submit" class="btn btn-dark">등록</button>
    </form>
</div>

<script>
    const dropZone = document.querySelector("#dropZone");
    const fileInput = document.querySelector("#fileInput");
    const preview = document.querySelector("#preview");
    
	// 사용자가 파일을 선택하거나 드래그하면 파일객체가 들어갈 예정인 빈 배열
    let selectedFiles = [];
	// drop zone 을 클릭했을때 input type = "file" 을 강제 클릭해서 파일 선택창이 열리도록 한다.
    dropZone.addEventListener("click", () => fileInput.click());
	
    // drop zone 에 마우스가 드레그해서 들어갔을때
    dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        // dragover 클래스를 추가해서 회색으로 변경되도록 한다. 
        dropZone.classList.add("dragover");
    });
    // drop zone 에 마우스가 드레그해서 나갔을때
    dropZone.addEventListener("dragleave", () => {
    	// dragover 클래스를 제거해서 색상이 원래 색으로 돌아가도록 한다.
        dropZone.classList.remove("dragover");
    });
	// 파일을 끌어다가 drop 했을때
    dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        
        // 선택된 파일객체가 들어있는 배열을 기능을 모두 쓸 수 있는 배열로 변경한다음
        const files = Array.from(e.dataTransfer.files);
        // 기존에 선택한 파일이 들어있는 배열에 합친다 
        selectedFiles = [...selectedFiles, ...files];
        // preview 를 업데이트한다. 
        updatePreview();
    });
	// drag drop 이 아니고 파일을 직접 선택했을때 input type="file" 에 change 이벤트가 발생한다
    fileInput.addEventListener("change", () => {
    	// 위와 동일한 동작을 한다 ...files = concat(files)
        const files = Array.from(fileInput.files);
        selectedFiles = selectedFiles.concat(files);
        updatePreview();
    });
	// preview 를 업데이트 하는 함수 (내부에서 await 가 있는 비동기 함수이기에 async 키워드를 붙여서 만들었다.)
    async function updatePreview() {
		// 이미 출력된 이미지를 모두 없애고 
        preview.innerHTML = "";
		// input type = "file" 에 value 를 넣어줄 정보를 구성하기 위한 객체
        const dataTransfer = new DataTransfer();
		
		// 반복문 돌면서 선택된 파일 객체를 순서대로 참조하면서 
        for (let i = 0; i < selectedFiles.length; i++) {
            // i 번째 파일 객체를 불러와서
        	const file = selectedFiles[i];
            // 만일 이미지 파일이 아니라면 continue (for 문을 계속 실행, conitnue 아래의 코드를 실행하지 않음.)
            // 반복문 실행 중에 conitnue 를 만나면 실행의 흐름이 for문 으로 다시 이동됨.
            if (!file.type.startsWith("image/")) continue;
				
            try {
            	// 선택한 이미지 파일을 읽어들여서 결과를 얻어낸다. 
                // await 이 있는 것은 Promise 객체가 resolve 될때까지 기다린다.
                // 이미지를 읽는데에는 시간이 필요할 수도 있기 때문, 잠시 대기 
                // 그래서 updatePreview 를 async 로 만든 것이다. 
            	const imageUrl = await readFileAsDataURL(file);  
				
                const container = document.createElement("div");
                container.classList.add("preview-item")
					
                const img = document.createElement("img");
                img.setAttribute("src", imageUrl);
				
                const btn = document.createElement("button");
                btn.classList.add("remove-btn");
                btn.innerText = "×";
                btn.addEventListener("click", () => {
                    // selectedFiles 배열에서 i 번째 방으로부터 1개의 item 삭제
                	selectedFiles.splice(i, 1);
                    // 삭제후 preview 가 다시 update 되도록 함수를 다시 호출해준다
                    updatePreview();
                });
					
                container.insertAdjacentElement("beforeend", img);
                container.insertAdjacentElement("beforeend", btn);
                preview.insertAdjacentElement("beforeend", container);
				// DataTransfer 객체에 파일객체를 추가 
                dataTransfer.items.add(file);
            } catch (err) {
                console.error("이미지 로딩 실패:", err);
            }
        }
		// 선택한 파일(이미지 파일만 선별)객체가 들어있는 배열 input type ="file" 의 value 로 넣어준다. 
        fileInput.files = dataTransfer.files;
    }
	// promise를 사용하지 않으면 이미지를 추가할때 추가된 이미지의 순서가 바뀔 수 있다
	// 그래서 promise 를 사용해서 순서를 지켜준다 
	
    // 전돨된 파일을 읽어들이는 Promise 객체를 리턴해주는 함수 
    function readFileAsDataURL(file) {
        return new Promise((resolve, reject) => {
        	// FileReader 객체를 이용해서 파일을 읽어들이고 
            const reader = new FileReader();
        	// 모두다 읽었을때 실행할 함수 등록 
            reader.onload = () => {
            	// 읽은 data url 문자열을 resolve() 함수를 호출하면서 전달한다(Promise 가 해결된다)
            	resolve(reader.result);
            }
            reader.readAsDataURL(file);
        });
    }
	// 폼에 "submit" 이벤트가 일어났을때 실행할 함수 등록
	document.querySelector("#saveForm").addEventListener("submit", (e)=>{
		// 여기서 폼 입력란에 대한 검증을 하고 폼 제출을 막고 싶으면 e.preventDefault() 를 실행하게 하면 된다.
		
		// 만일 선택한 파일이 없다면 폼 전송 막기
		if(selectedFiles.length < 1){
			alert("업로드할 이미지를 1개 이상 선택해주세요")
			e.preventDefault();
		}
	})
</script>
	
	<th:block th:insert="~{/include/footer :: footer}"></th:block>
</body>
</html>
