<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>/templates/book/list.html</title>
<th:block th:insert="/include/resource"></th:block>
</head>
<body>
	<div class="container mt-4">
		<h1 class="mb-4">도서 목록</h1>
			<table class="table table-striped table-hover text-center align-middle">
				<thead class="table-dark">
					<tr>
						<th>번호</th>
						<th>제목</th>
						<th>작가</th>
						<th>출판사</th>
						<th>수정</th>
						<th>삭제</th>
					</tr>
				</thead>
				<tbody>
						<tr th:each="tmp : ${list}">
							<td>[[${tmp.id }]]</td>
							<td>[[${tmp.title }]]</td>
							<td>[[${tmp.author }]]</td>
							<td>[[${tmp.publisher }]]</td>
							<td>
								<a th:href="@{/book/updateform(id=${tmp.id})}">수정</a>
							</td>
							<td><a th:href="@{/book/delete(id=${tmp.id})}" 
									onclick="return confirm('삭제하시겠습니까?');">삭제</a>
							</td>
						</tr>
				</tbody>
			</table>
			<div class="mt-3 text-end">
				<a th:href="@{/}" class="btn btn-secondary">인덱스로 가기</a>
				<a th:href="@{/book/insertform}" class="btn btn-primary">도서 추가</a>
			</div>
	</div>
</body>
</html>
