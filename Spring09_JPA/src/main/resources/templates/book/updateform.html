<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>/templates/book/updateform.html</title>
<th:block th:insert="/include/resource"></th:block>
</head>
<body>
<h1>도서정보 수정폼</h1>
	<form th:action="@{/book/update}" method="post">
		<div>
			<label for="id">번호</label>
			<input type="hidden" name="id" id="id" th:value="${dto.id }" />
		</div>
		<div>
			<label for="title">제목</label>
			<input type="text" name="title" id="title" th:value="${dto.title }" />
		</div>
		<div>
			<label for="author">작가</label>
			<input type="text" name="author" id="author" th:value="${dto.author }" />
		</div>
		<div>
			<label for="publisher">출판사</label>
			<input type="text" name="publisher" id="publisher" th:value="${dto.publisher }" />
		</div>
		<button type="submit" class="submit">수정 확인</button>
		<button type="reset" class="reset">취소</button>
	</form>
</body>
</html>
